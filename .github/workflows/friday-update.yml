name: Friday Bigshot Update & Screener

on:
  schedule:
    # Friday 15:00 CST = 07:00 UTC
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install akshare pandas requests markdown playwright
      - run: playwright install-deps chromium || true
      - run: playwright install chromium

      - name: Setup NGA cookie
        run: echo "${{ secrets.NGA_COOKIE }}" > data/nga_cookie.txt

      - name: Incremental bigshot update
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: python3 scripts/bigshot_incremental.py

      - name: Bigshot stock picks (incremental)
        run: python3 scripts/nga_bigshot_stocks.py --incremental --save

      - name: Generate profiles report
        run: python3 scripts/generate_bigshot_profiles.py
        continue-on-error: true

      - name: LLM screener
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: python3 scripts/llm_screener.py

      - name: Build static site
        run: python3 scripts/build_static.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Git commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/nga/bigshot_content/ data/nga/bigshot_profiles/ output/bigshot_profiles/ output/bigshot_screener/ data/nga/screen_results/ data/nga/last_scan.json output/bigshot_picks/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: friday update $(date +%Y-%m-%d)"
            git pull --rebase origin master
            git push
          fi
