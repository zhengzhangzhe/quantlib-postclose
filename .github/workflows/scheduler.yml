name: Reliable Scheduler

on:
  schedule:
    # Every 15 minutes on weekdays
    - cron: '*/15 0-1,13 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch based on time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOUR=$(date +%H -u)
          MINUTE=$(date +%M -u)
          echo "UTC time: ${HOUR}:${MINUTE}"

          # Morning briefing at 09:00 CST (01:00 UTC), fire between 01:00-01:14
          if [ "$HOUR" = "01" ] && [ "$MINUTE" -lt "15" ]; then
            echo "Triggering morning briefing..."
            gh workflow run morning.yml -R ${{ github.repository }}
            exit 0
          fi

          # Postclose review at 21:00 CST (13:00 UTC), fire between 13:00-13:14
          if [ "$HOUR" = "13" ] && [ "$MINUTE" -lt "15" ]; then
            echo "Triggering postclose review..."
            gh workflow run postclose.yml -R ${{ github.repository }}
            exit 0
          fi

          echo "No task scheduled for this time slot, skipping"
