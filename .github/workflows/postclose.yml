name: Postclose Review

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install akshare pandas requests markdown

      - name: Run postclose review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: python3 scripts/postclose_review.py

      - name: Run bigshot screener (Friday only)
        run: |
          DOW=$(date +%u)
          if [ "$DOW" -eq 5 ]; then
            python3 scripts/bigshot_screener.py
          else
            echo "Skipping screener (not Friday, DOW=$DOW)"
          fi

      - name: Generate screener report
        run: |
          python3 -c "
          import json
          from pathlib import Path
          from datetime import datetime, timedelta
          today = datetime.now().strftime('%Y-%m-%d')
          data_file = Path('data/nga/screen_results.json')
          if not data_file.exists():
              print('No screener data, skipping')
              exit(0)
          data = json.loads(data_file.read_text())
          # Show week range
          d = datetime.strptime(data['date'], '%Y-%m-%d')
          week_start = (d - timedelta(days=d.weekday())).strftime('%m/%d')
          week_end = (d + timedelta(days=4-d.weekday())).strftime('%m/%d')
          lines = [f'# 大佬海选周报 · {data[\"date\"]} ({week_start}~{week_end})', '',
                   '| 大佬 | 候选 | Top 3 |',
                   '|------|------|-------|']
          for key, label in [('d','d佬(超短)'),('wj','文驹(钨/有色)'),('tl','兔佬(低位)'),
                             ('yl','鸭佬(打板)'),('sai','sai佬(半导)'),('wolf','狼大(科技)')]:
              cands = data.get(key, [])
              top3 = ' · '.join(f\"{c['name']}({c['code']})\" for c in cands[:3]) if cands else '-'
              lines.append(f'| {label} | {len(cands)} | {top3} |')
          report = '\n'.join(lines)
          out = Path('output/bigshot_screener') / f'{data[\"date\"]}.md'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(report)
          print(f'Screener report: {out}')
          "

      - name: Run consistency check
        run: python3 scripts/consistency_check.py || echo "校验跳过(无简报数据)"
        continue-on-error: true

      - name: Build static site
        run: python3 scripts/build_static.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Git commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/ output/ data/nga/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: postclose review $(date +%Y-%m-%d)"
            git pull --rebase origin master
            git push
          fi
