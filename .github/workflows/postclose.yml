name: Postclose Review

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip weekends
        run: |
          DOW=$(date +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend, skipping"
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install akshare pandas requests markdown

      - name: Run postclose review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: python3 scripts/postclose_review.py

      - name: Run bigshot screener (Friday only)
        run: |
          DOW=$(date +%u)
          if [ "$DOW" -eq 5 ]; then
            python3 scripts/bigshot_screener.py
          else
            echo "Skipping screener (not Friday, DOW=$DOW)"
          fi

      - name: Generate screener report
        run: python3 scripts/generate_screener_report.py

      - name: Run consistency check
        run: python3 scripts/consistency_check.py || echo "校验跳过(无简报数据)"
        continue-on-error: true

      - name: Build static site
        run: python3 scripts/build_static.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Git commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/ output/ data/nga/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: postclose review $(date +%Y-%m-%d)"
            git pull --rebase origin master
            git push
          fi
