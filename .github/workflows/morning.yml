name: Morning Briefing

on:
  schedule:
    # Mon-Fri 09:00 CST = 01:00 UTC
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install akshare pandas requests markdown

      - name: Run morning briefing
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: python3 scripts/morning_briefing.py

      - name: Build static site
        run: python3 scripts/build_static.py

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Git commit & push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add data/ output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: morning briefing $(date +%Y-%m-%d)"
            git pull --rebase origin master
            git push
          fi
