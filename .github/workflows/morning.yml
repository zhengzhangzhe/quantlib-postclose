name: Morning Briefing

on:
  schedule:
    # Mon-Fri 09:00 CST = 01:00 UTC
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install akshare pandas requests

      - name: Run morning briefing
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: python3 scripts/morning_briefing.py

      - name: Push to WeChat
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: python3 scripts/notify.py

      - name: Git commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/
          git diff --staged --quiet || git commit -m "auto: morning briefing $(date +%Y-%m-%d)"
          git push
